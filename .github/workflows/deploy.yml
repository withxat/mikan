name: Deploy demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: actions/configure-pages@v6
        id: pages
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test
      - run: pnpm build && pnpm test:build
        env:
          SITE_URL: https://${{ steps.pages.outputs.host }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Publish static files to mikan branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}.git
        run: |
          touch dist/.nojekyll
          output_dir="$(mktemp -d)"
          cp -a dist/. "$output_dir/"
          cd "$output_dir"
          git init -b mikan
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "$REPOSITORY_URL"
          gh auth setup-git
          git ls-remote --heads origin mikan > "$RUNNER_TEMP/mikan-branch"
          if test -s "$RUNNER_TEMP/mikan-branch"; then
            git fetch --depth=1 origin mikan
            git reset --soft FETCH_HEAD
          fi
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "chore: deploy demo from $GITHUB_SHA"
          fi
          git push origin HEAD:refs/heads/mikan
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
